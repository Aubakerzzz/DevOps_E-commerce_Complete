name: Build and Deploy to AWS ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Edit these values here; they are not GitHub secrets.
env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: leyo-cluster
  ECS_SERVICE: leyo-service
  DOCKER_USERNAME: aubakerzzz

# Prevent overlapping deployments to the same ECS service.
concurrency:
  group: leyo-ecs-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/leyo-client:latest
            ${{ env.DOCKER_USERNAME }}/leyo-client:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/leyo-server:latest
            ${{ env.DOCKER_USERNAME }}/leyo-server:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify existing ECS infrastructure
        run: |
          set -e

          aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER" \
            --query 'clusters[?status==`ACTIVE`].clusterName' \
            --output text | grep -Fx "$ECS_CLUSTER"

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[?status==`ACTIVE`].serviceName' \
            --output text | grep -Fx "$ECS_SERVICE"

      - name: Deploy latest images to ECS
        run: |
          set -e

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "Deployment completed successfully."
          echo "Frontend: http://$ECS_CLUSTER"