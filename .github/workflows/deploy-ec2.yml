name: Deploy Leyo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leyo-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      EC2_INSTANCE_ID: i-0e1e5b24362534a27
      SSH_USER: ubuntu

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push ephemeral SSH key via EC2 Instance Connect
        run: |
          set -euo pipefail
          ssh-keygen -t ed25519 -f /tmp/ec2_key -N ""
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$EC2_INSTANCE_ID" \
            --instance-os-user "$SSH_USER" \
            --ssh-public-key file:///tmp/ec2_key.pub

      - name: Deploy via SSH
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          IP=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          ssh -i /tmp/ec2_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@$IP" bash -s <<EOF
          set -euo pipefail
          command -v git    >/dev/null || sudo apt-get install -y git
          command -v docker >/dev/null || (sudo apt-get update && sudo apt-get install -y docker.io docker-compose-v2)
          sudo systemctl enable --now docker

          rm -rf /tmp/leyo && git clone --depth 1 --branch main "$REPO_URL" /tmp/leyo
          sudo mkdir -p /opt/leyo
          sudo rsync -a --delete --exclude='.env' --exclude='.git' /tmp/leyo/ /opt/leyo/
          rm -rf /tmp/leyo
          cd /opt/leyo
          sudo docker compose up -d --build
          sudo docker compose ps
          EOF